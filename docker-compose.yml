# myAgent gateway(+core) + frontend + postgres (spec §10).
# Usage:
#   MODEL_ID=glm-5 OPENAI_API_KEY=sk-... docker compose up --build
# Public entry point is nginx on :80, which proxies /api/* → gateway:8000
# (with WebSocket upgrade) and everything else → frontend:3000. frontend and
# gateway are bound to 127.0.0.1 on the host for local debug only.
# The gateway reads .env at runtime via env_file; MODEL_ID is required.
# Session history persists in the postgres volume across restarts.
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=myagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      # Local debug only (host loopback). Public traffic enters via nginx on :80,
      # which proxies /api/* to this service inside the compose network.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_ID=${MODEL_ID:?MODEL_ID is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/myagent
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ${HOME}/.myAgent/workspace:/app/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Agent state (.tasks/ .memory/ .transcripts/ …) lives in the container's
    # writable layer at /app (= WORKDIR = code.py's cwd). For persistence across
    # rebuilds, mount a named volume at /app/state and set the agent's WORKDIR
    # there — but then skills/ must also be reachable, so leave as-is for the
    # teaching reference. Conversation history, however, now lives in postgres.
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # NEXT_PUBLIC_GATEWAY_URL unset by default → frontend uses same-origin
      # (window.location.origin), which is correct behind the nginx proxy.
      # Set this only if you serve the frontend on a different origin than the API.
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-}
    ports:
      # Local debug only. Public traffic enters via nginx on :80.
      - "127.0.0.1:3000:3000"
    depends_on:
      - gateway
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
