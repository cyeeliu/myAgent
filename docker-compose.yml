# myAgent gateway(+core) + frontend + postgres (spec §10).
# Usage:
#   MODEL_ID=glm-5 OPENAI_API_KEY=sk-... docker compose up --build
# Public entry point is nginx on :80, which proxies /api/* → gateway:8000
# (with WebSocket upgrade) and everything else → frontend:3000. frontend and
# gateway are bound to 127.0.0.1 on the host for local debug only.
# The gateway reads .env at runtime via env_file; MODEL_ID is required.
# Session history persists in the postgres volume across restarts.
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=myagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      # Local debug only (host loopback). Public traffic enters via nginx on :80,
      # which proxies /api/* to this service inside the compose network.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_ID=${MODEL_ID:?MODEL_ID is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/myagent
      - REDIS_URL=redis://redis:6379/0
      # Conversation-flow debug logging (agent_gateway/debug.py). 1/true to enable.
      - AGENT_DEBUG=${AGENT_DEBUG:-0}
      # Context budget (tokens) — ToolPanel stat denominator + auto-compact trigger.
      - AUTO_COMPACT_WINDOW=${AUTO_COMPACT_WINDOW:-128000}
    volumes:
      - ${HOME}/.myAgent/workspace:/app/workspace
      # Agent/team/model config (.agents/*.json — agent defs, agents_config.json,
      # model.json). Code writes to /app/.agents (= REPO_ROOT/.agents); this
      # bind-mount backs it with ~/.myAgent/agents on the host so config survives
      # container recreates. Sibling to the workspace mount; not under /app/workspace
      # so it stays out of the AgentPanel file tree.
      - ${HOME}/.myAgent/agents:/app/.agents
      # On-disk session artifacts (transcript.md / history.json) browsed by the
      # SessionsPanel via /file-api. Persisted across container recreates.
      - sessiondata:/app/agent/sessions
      # Dev: mount live source so code changes apply on restart without a full
      # rebuild (base images node:20-slim/python:3.12-slim aren't always pullable).
      - ./agent_gateway:/app/agent_gateway:ro
      - ./agent_core:/app/agent_core:ro
      - ./code.py:/app/code.py:ro
      # Preset skills source for the startup seed (rebuild-agent-data copies
      # these into /app/workspace/skills on gateway start). :ro so the host
      # skills/ dir is the source of truth; edits apply on restart.
      - ./skills:/app/skills:ro
      # Eval datasets (evals/datasets/*.json) read by EvalRunManager.list_datasets
      # to populate the EvalsPanel dataset dropdown. :ro so the host evals/ dir is
      # the source of truth; dataset edits apply on restart without a rebuild.
      - ./evals:/app/evals:ro
    # bubblewrap sandbox (agent_core/sandbox.py) needs to create mount+user
    # namespaces inside the container, which docker's default seccomp/cap set
    # blocks. Relax just enough for bwrap; the gateway still binds 127.0.0.1
    # (public entry is nginx). Drop these if you set SANDBOX=0.
    security_opt:
      - "seccomp=unconfined"
      - "apparmor=unconfined"
    cap_add:
      - SYS_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Agent state (.tasks/ .memory/ .transcripts/ …) lives in the container's
    # writable layer at /app (= WORKDIR = code.py's cwd). For persistence across
    # rebuilds, mount a named volume at /app/state and set the agent's WORKDIR
    # there — but then skills/ must also be reachable, so leave as-is for the
    # teaching reference. Conversation history, however, now lives in postgres.
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # VITE_API_BASE/VITE_WS_BASE unset by default → the Vite frontend uses
      # same-origin (window.location.host), correct behind the nginx proxy.
      # Set these only if the frontend is served on a different origin than the API.
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_WS_BASE: ${VITE_WS_BASE:-}
    ports:
      # Local debug only. Public traffic enters via nginx on :80.
      - "127.0.0.1:3000:3000"
    depends_on:
      - gateway
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  sessiondata:
