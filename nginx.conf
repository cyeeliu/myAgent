# Reverse proxy in front of frontend (3000) + gateway (8000).
# Public entry point: only port 80 is exposed. The browser uses same-origin
# (window.location.origin), so /api/* hits this nginx and gets proxied to the
# gateway with WebSocket upgrade; everything else goes to the Next.js frontend.

# Map the Upgrade header to "upgrade" only when the client requested it;
# otherwise pass through as-is so regular HTTP keepalive works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gateway_upstream {
    server gateway:8000;
}
upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Gateway API + WebSocket. WS upgrade headers must be passed through.
    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived streams: don't buffer, allow long timeouts.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Frontend (Next.js SSR + static).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR WS (dev only; harmless in prod `next start`).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
